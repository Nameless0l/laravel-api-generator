openapi: 3.1.0
info:
  title: Shop
  version: 1.0.0
paths: {}
components:
  schemas:
    Customer:
      type: object
      required: [name, email]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        phone:
          type: [string, 'null']
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        createdAt:
          type: string
          format: date-time
    Product:
      type: object
      required: [sku, title, price]
      properties:
        id:
          type: integer
        sku:
          type: string
        title:
          type: string
        description:
          type: string
          maxLength: 5000
        price:
          type: number
          format: double
        stock:
          type: integer
          default: 0
        active:
          type: boolean
    Order:
      type: object
      required: [stage, total]
      properties:
        id:
          type: integer
        stage:
          $ref: '#/components/schemas/OrderStage'
        total:
          type: number
        placedAt:
          type: string
          format: date-time
        buyer:
          allOf:
            - $ref: '#/components/schemas/Customer'
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        deletedAt:
          type: [string, 'null']
          format: date-time
    OrderLine:
      type: object
      required: [quantity]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        productId:
          type: integer
        quantity:
          type: integer
        unitPrice:
          type: number
    OrderStage:
      type: string
      enum: [cart, placed, shipped, delivered, cancelled]
    NewOrder:
      type: object
      properties:
        buyerId:
          type: integer
    OrderList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    Error:
      type: object
      properties:
        message:
          type: string
