name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            laravel-version: '10.*'
          - php-version: '8.2'
            laravel-version: '11.*'
          - php-version: '8.3'
            laravel-version: '11.*'
          - php-version: '8.3'
            laravel-version: '12.*'
          - php-version: '8.4'
            laravel-version: '12.*'
          - php-version: '8.5'
            laravel-version: '12.*'
          - php-version: '8.3'
            laravel-version: '13.*'
          - php-version: '8.4'
            laravel-version: '13.*'
          - php-version: '8.5'
            laravel-version: '13.*'

    name: PHP ${{ matrix.php-version }} - Laravel ${{ matrix.laravel-version }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: none

    - name: Cache Composer dependencies
      uses: actions/cache@v6
      with:
        path: ~/.composer/cache/files
        key: dependencies-laravel-${{ matrix.laravel-version }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.json') }}

    - name: Install dependencies
      run: |
        composer require "laravel/framework:${{ matrix.laravel-version }}" --no-interaction --no-update
        composer install --prefer-dist --no-interaction

    - name: Run tests
      run: vendor/bin/phpunit

  generated-app:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        laravel-version: ['12.*', '13.*']

    name: Generated app - Laravel ${{ matrix.laravel-version }}

    steps:
    - uses: actions/checkout@v7
      with:
        path: package

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl
        coverage: none

    - name: Create a fresh Laravel application
      run: composer create-project laravel/laravel app "${{ matrix.laravel-version }}" --prefer-dist --no-interaction

    - name: Install the package from this checkout
      working-directory: app
      run: |
        composer config repositories.package '{"type": "path", "url": "../package", "options": {"symlink": true, "versions": {"nameless/laravel-api-generator": "dev-ci"}}}'
        composer require --dev "nameless/laravel-api-generator:dev-ci" --no-interaction

    - name: Preview the example API without writing it
      working-directory: app
      run: |
        find app database routes -type f -exec md5sum {} + | sort > before.txt
        php artisan make:fullapi --schema=../package/examples/api-schema.yaml --dry-run --json > plan.json
        find app database routes -type f -exec md5sum {} + | sort > after.txt
        diff before.txt after.txt
        php -r '$d = json_decode(file_get_contents("plan.json"), true); exit($d["protocol"] === 1 && $d["dryRun"] === true && count($d["files"]) > 0 && $d["errors"] === [] ? 0 : 1);'

    - name: Talk to the preview worker
      working-directory: app
      run: |
        printf '%s\n' \
          '{"jsonrpc":"2.0","id":1,"method":"handshake","params":{"client":"ci"}}' \
          '{"jsonrpc":"2.0","id":2,"method":"plan","params":{"schema":{"entities":{"Book":{"fields":{"title":"string"}}}}}}' \
          '{"jsonrpc":"2.0","id":3,"method":"shutdown"}' \
          | php artisan api-generator:serve --stdio > worker.out
        php -r '$l = array_map(fn ($x) => json_decode($x, true), file("worker.out", FILE_IGNORE_NEW_LINES)); exit(count($l) === 3 && $l[0]["result"]["protocol"] === 1 && $l[1]["result"]["files"] !== [] && array_key_exists("result", $l[2]) ? 0 : 1);'
        test ! -e app/Models/Book.php

    - name: Generate the example API
      working-directory: app
      run: php artisan make:fullapi --schema=../package/examples/api-schema.yaml --no-interaction

    - name: Run the migrations
      working-directory: app
      run: php artisan migrate --force --no-interaction

    - name: Run the generated tests
      working-directory: app
      run: |
        rm -f tests/Feature/ExampleTest.php tests/Unit/ExampleTest.php
        php artisan test

  static-analysis:
    runs-on: ubuntu-latest

    name: Static Analysis (PHPStan)

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction

    - name: Run PHPStan
      run: vendor/bin/phpstan analyse --error-format=github

  code-style:
    runs-on: ubuntu-latest

    name: Code Style (Pint)

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction

    - name: Check code style
      run: vendor/bin/pint --test
